name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The browser suite arrives with the tests section. Until then it has
      # nothing to run, and leaving it here would fail the job.
      # - run: pnpm --filter web exec playwright install --with-deps chromium
      # - run: pnpm e2e
